<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NILAI Live</title>
<style>
  :root { --bg:#0e1420; --panel:#161e2e; --ink:#e8eef6; --muted:#8a97ab; --teal:#2ec4b6; --orange:#ff9f43; --red:#ff6b6b; --blue:#6ea8fe; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; justify-content:space-between; padding:16px 24px; }
  h1 { margin:0; font-size:20px; letter-spacing:2px; color:var(--teal); }
  .src { color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: 280px 1fr; gap:16px; padding:0 24px 24px; }
  .panel { background:var(--panel); border-radius:12px; padding:16px; }
  .state { font-size:28px; font-weight:700; margin:6px 0 2px; }
  .score { font-size:56px; font-weight:800; line-height:1; }
  .k { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:1px; margin-top:14px; }
  .v { font-size:18px; font-variant-numeric:tabular-nums; }
  canvas { width:100%; height:150px; display:block; }
  .plots { display:grid; gap:16px; }
  .legend { color:var(--muted); font-size:12px; margin-bottom:6px; }
  @media (max-width: 760px) { main { grid-template-columns:1fr; } }
</style>
</head>
<body>
<header><h1>NILAI · LIVE</h1><span class="src">source: {{ source }}</span></header>
<main>
  <section class="panel">
    <div class="k">State</div>
    <div class="state" id="label">—</div>
    <div class="src" id="truth"></div>
    <div class="k">Tremor score</div>
    <div class="score" id="score">0</div>
    <div class="k">Tremor frequency</div><div class="v" id="hz">—</div>
    <div class="k">EMG ↔ gyro coherence</div><div class="v" id="coh">—</div>
    <div class="k">Tremor-band share</div><div class="v" id="ratio">—</div>
    <div class="k">EMG median frequency</div><div class="v" id="mdf">—</div>
  </section>
  <section class="plots">
    <div class="panel"><div class="legend">Forearm EMG (raw)</div><canvas id="emg"></canvas></div>
    <div class="panel"><div class="legend"><span style="color:var(--orange)">■</span> measured motion &nbsp; <span style="color:var(--teal)">■</span> steady twin (tremor removed by WFLC)</div><canvas id="gyro"></canvas></div>
    <div class="panel"><div class="legend">Tremor score history</div><canvas id="hist"></canvas></div>
  </section>
</main>
<script>
const COLORS = { tremor:'#ff6b6b', voluntary:'#6ea8fe', rest:'#8a97ab', external_vibration:'#ff9f43' };
const NAMES = { tremor:'Tremor', voluntary:'Intentional movement', rest:'At rest', external_vibration:'External vibration (ignored)' };
const hist = [];
function draw(id, series, colors, range) {
  const c = document.getElementById(id), dpr = window.devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  const g = c.getContext('2d'); g.clearRect(0,0,c.width,c.height);
  let lo = Infinity, hi = -Infinity;
  series.forEach(s => s.forEach(v => { lo = Math.min(lo, v); hi = Math.max(hi, v); }));
  if (range) { [lo, hi] = range; }
  if (hi - lo < 1e-6) { hi += 1; lo -= 1; }
  series.forEach((s, i) => {
    g.strokeStyle = colors[i]; g.lineWidth = 1.5 * dpr; g.beginPath();
    s.forEach((v, j) => { const x = j / (s.length - 1) * c.width, y = c.height - (v - lo) / (hi - lo) * c.height;
      j ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.stroke();
  });
}
const es = new EventSource('/stream');
es.onmessage = e => {
  const m = JSON.parse(e.data);
  const L = document.getElementById('label'); L.textContent = NAMES[m.label] || m.label; L.style.color = COLORS[m.label];
  document.getElementById('truth').textContent = m.truth ? 'simulated scenario: ' + m.truth : '';
  document.getElementById('score').textContent = Math.round(m.tremor_score);
  document.getElementById('hz').textContent = m.tremor_peak_hz.toFixed(1) + ' Hz';
  document.getElementById('coh').textContent = m.emg_gyro_coherence.toFixed(2);
  document.getElementById('ratio').textContent = Math.round(m.tremor_band_ratio * 100) + ' %';
  document.getElementById('mdf').textContent = m.emg_median_hz.toFixed(0) + ' Hz';
  draw('emg', [m.emg], ['#6ea8fe']);
  draw('gyro', [m.gyro, m.steady], ['#ff9f43', '#2ec4b6']);
  hist.push(m.tremor_score); if (hist.length > 240) hist.shift();
  draw('hist', [hist], ['#ff6b6b'], [0, 100]);
};
</script>
</body>
</html>
